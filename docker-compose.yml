services:
  battery-showcase:
    build: .
    image: battery-showcase:latest
    container_name: battery-showcase
    restart: unless-stopped
    # 只绑回环，公网必须经 Nginx 的 battery.seans.cc.cd 进来
    ports:
      - "127.0.0.1:7023:7023"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      # 后台页面挂载出来，改前端不用重新 build 镜像
      - ./static:/app/static
    mem_limit: 256m
    memswap_limit: 384m
    pids_limit: 128
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:7023/api/health',timeout=4)"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
